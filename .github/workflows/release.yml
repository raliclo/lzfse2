# Release builds for lzfse, modelled on multissh's ci.yml. / lzfse 的正式版建置，以 multissh 的 ci.yml 為範本。
#
# Build: a push that touches the CLI or the release scripts builds, strips, verifies and packages all six targets
# with release.zsh (which runs the stripped copy and round-trips data through it). Verify: each archive is then
# checked again by verify_archive.zsh on a fresh runner with no Swift (the `verify` job, added 2026-11-11).
# 驗證：每份封存接著在沒有 Swift 的新 runner 上由 verify_archive.zsh 再檢查一次（`verify` job，2026-11-11 加入）。
# Release: this workflow does NOT create the release. A pushed tag v<X.Y.Z> (publish.zsh --github) builds the same
# way; publish.zsh then downloads these artifacts, checks them and creates the release with the maintainer's own gh
# login, so GitHub shows the maintainer, not github-actions, as the one who released it (the user's decision,
# 2026-11-04). Hence no contents: write here.
# 建置：凡觸及 CLI 或發布腳本的 push，都以 release.zsh 建置、strip、驗證並打包全部六個目標（它會執行 strip 後的副本
# 並以它完成資料往返）。
# 發布：本 workflow **不**建立 release。推送 tag v<X.Y.Z>（publish.zsh --github）時同樣建置；之後 publish.zsh 下載這些
# artifact、檢查，再以維護者自己的 gh 登入建立 release，GitHub 才會顯示是維護者發布的，而不是 github-actions
# （使用者 2026-11-04 的決定）。因此這裡不需要 contents: write。
#
# Targets: {linux (musl), macos, windows} x {x86_64,arm64}. Linux ships musl only, as swift_tar: a glibc build needs a
# glibc as new as the runner's (GLIBC_2.38 on Ubuntu 24.04). No x86-32: macOS has no 32-bit x86 and Swift ships no
# i686 toolchain for Windows or Linux.
# 目標：{linux (musl), macos, windows} x {x86_64,arm64}。Linux 只出 musl 版，與 swift_tar 相同：glibc 建置需要不比
# runner 舊的 glibc（Ubuntu 24.04 上是 GLIBC_2.38）。沒有 x86-32：macOS 沒有 32 位元 x86，Swift 也沒有提供 Windows
# 或 Linux 的 i686 工具鏈。
name: Release

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    # Path filters are not applied to tag pushes, so a tag always builds.
    # 路徑過濾不套用在 tag 推送上，所以 tag 一定會建置。
    # release.zsh sources helper_windows/swift_windows_env.zsh and calls verify_archive.zsh, so both count.
    # release.zsh 會 source helper_windows/swift_windows_env.zsh 並呼叫 verify_archive.zsh，所以兩者都算。
    paths: ["lzfse-cli.swift", "release.zsh", "verify_archive.zsh", "helper_windows/swift_windows_env.zsh", "VERSION",
            ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SWIFT_VERSION: "6.4.2"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64-musl,   runner: ubuntu-24.04,     container: "swift:6.4.2-noble", musl: "--musl" }
          - { platform: linux-aarch64-musl,  runner: ubuntu-24.04-arm, container: "swift:6.4.2-noble", musl: "--musl" }
          - { platform: macos-x86_64,   runner: macos-15-intel }
          - { platform: macos-arm64,    runner: macos-15 }
          - { platform: windows-x86_64, runner: windows-2025,     swift_arch: amd64 }
          - { platform: windows-arm64,  runner: windows-11-arm,   swift_arch: arm64 }
    steps:
      # Linux: the musl jobs (release.zsh --musl, as swift_tar's --musl) need the Swift Static
      # Linux SDK, which must match swiftc exactly; the checksum is swift.org's (the same one multissh's ci.yml pins).
      # Linux：musl 的 job（release.zsh --musl，同 swift_tar 的 --musl）需要 Swift Static Linux SDK，它必須
      # 與 swiftc 完全相符；checksum 取自 swift.org（與 multissh 的 ci.yml 釘選的相同）。
      - name: Tools (Linux) / 工具（Linux）
        if: runner.os == 'Linux'
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git zsh binutils zstd

      - name: Swift Static Linux SDK (musl) / Swift Static Linux SDK（musl）
        if: matrix.musl
        run: |
          swift sdk install \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/static-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz" \
            --checksum 3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a
          # Where it landed, for the log; release.zsh asks swift sdk configure for the same path.
          # 印出安裝位置供日誌查閱；release.zsh 向 swift sdk configure 詢問同一個路徑。
          swift sdk list
          swift sdk configure --show-configuration "swift-${SWIFT_VERSION}-RELEASE_static-linux-0.1.0" "$(uname -m)-swift-linux-musl"

      - name: Tools (macOS) / 工具（macOS）
        if: runner.os == 'macOS'
        run: |
          command -v zstd >/dev/null || brew install zstd
          swiftc --version

      # build_arch defaults to amd64: on windows-11-arm that installs the x64 toolchain, which crashes (multissh run 3).
      # build_arch 預設 amd64：在 windows-11-arm 上會裝成 x64 工具鏈而崩潰（multissh 第 3 次執行）。
      - name: Swift (Windows) / Swift（Windows）
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@main
        # swift-version and swift-build replace branch and tag, which the action deprecated (warning in run
        # 42946390857); giving an old and a new one together is an error there.
        # swift-version 與 swift-build 取代已被 action 棄用的 branch 與 tag（第 42946390857 次執行的警告）；新舊同時
        # 給在那邊會被當成錯誤。
        with:
          build_arch: ${{ matrix.swift_arch }}
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE

      - name: zsh (Windows) / zsh（Windows）
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: zsh zstd tar diffutils

      # LF on Windows too: a CRLF checkout breaks every zsh script.
      # Windows 上也用 LF：CRLF 的 checkout 會讓每個 zsh 腳本壞掉。
      - name: LF line endings / LF 換行
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      # Full history and tags: the build id is `git describe`. No submodules: lzfse-cli.swift stands alone.
      # checkout@v5 and upload-artifact@v6 are the first majors on Node.js 24 (csv2 measured upload-artifact@v5 still
      # on node20); the older ones drew GitHub's Node.js 20 deprecation warning in run 42270242469.
      # 完整歷史與 tag：build id 是 `git describe`。不取子模組：lzfse-cli.swift 自成一體。
      # checkout@v5 與 upload-artifact@v6 是第一個以 Node.js 24 執行的主版本（csv2 實測 upload-artifact@v5 仍是
      # node20）；舊版在第 42270242469 次執行引來 GitHub 的 Node.js 20 棄用警告。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Build and package / 建置與打包
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          zsh release.zsh ${{ matrix.musl }}

      # llvm-strip and llvm-objdump live in C:\Program Files\LLVM\bin on the runner image. MSYS2's $HOME is not the
      # Windows profile, so the Swift runtime directory is named rather than searched for (multissh run 5).
      # llvm-strip 與 llvm-objdump 在 runner 映像的 C:\Program Files\LLVM\bin。MSYS2 的 $HOME 不是 Windows 使用者目錄，
      # 所以直接指定 Swift runtime 目錄而不搜尋（multissh 第 5 次執行）。
      - name: Build and package (Windows) / 建置與打包（Windows）
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="$PATH:/c/Program Files/LLVM/bin"
          export SWIFT_RUNTIME_DIR="$(cygpath -u "$LOCALAPPDATA")/Programs/Swift/Runtimes/$SWIFT_VERSION/usr/bin"
          zsh release.zsh

      # The platform the binary reports must be the one this job builds; a mismatch would upload one platform under
      # another's name.
      # 執行檔回報的平台必須就是這個 job 要建的平台；不一致會把一個平台以另一個的名字上傳。
      - name: Check platform / 檢查平台
        shell: bash
        run: |
          ls release/dist/${{ matrix.platform }}/lzfse-*-${{ matrix.platform }}.tar.zst
          ls release/dist/${{ matrix.platform }}/lzfse-*-${{ matrix.platform }}.tar.zst.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: lzfse-${{ matrix.platform }}
          path: |
            release/dist/${{ matrix.platform }}/*.tar.zst
            release/dist/${{ matrix.platform }}/*.tar.zst.sha256
          if-no-files-found: error

  # Each archive again, on a fresh runner that never had Swift installed: what a user's machine is. release.zsh
  # already ran verify_archive.zsh where the archive was built, with Swift present; here nothing of the build is
  # left to lean on. Linux runs on the bare runner, not the swift container, so a musl binary that still needed a
  # shared library would fail here. GitHub's Windows images do ship the VC++ redistributable, so this does not
  # stand for a Windows without it (verify_archive.zsh's header says what does).
  # 每份封存再驗一次，在一台從沒裝過 Swift 的新 runner 上：那才是使用者的機器。release.zsh 已在建出封存、裝著 Swift
  # 的地方跑過 verify_archive.zsh；這裡沒有任何建置留下的東西可以倚靠。Linux 跑在原生 runner 上而非 swift 容器，
  # 所以若 musl 執行檔仍需要某個共享函式庫，會在這裡失敗。GitHub 的 Windows 映像有裝 VC++ 可轉散發套件，所以這裡
  # 不能代表沒裝它的 Windows（verify_archive.zsh 的開頭說明了是什麼在支撐那個情況）。
  verify:
    name: verify ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64-musl,  runner: ubuntu-24.04 }
          - { platform: linux-aarch64-musl, runner: ubuntu-24.04-arm }
          - { platform: macos-x86_64,       runner: macos-15-intel }
          - { platform: macos-arm64,        runner: macos-15 }
          - { platform: windows-x86_64,     runner: windows-2025 }
          - { platform: windows-arm64,      runner: windows-11-arm }
    steps:
      - name: Tools (Linux) / 工具（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q zsh zstd >/dev/null

      - name: Tools (macOS) / 工具（macOS）
        if: runner.os == 'macOS'
        run: command -v zstd >/dev/null || brew install zstd

      - name: zsh (Windows) / zsh（Windows）
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: zsh zstd tar diffutils

      - name: LF line endings / LF 換行
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      # Only the script; the archive under test comes from the build job, not from this checkout.
      # 只取腳本；受測的封存來自 build job，不是這份 checkout。
      - uses: actions/checkout@v5
        with:
          sparse-checkout: verify_archive.zsh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          name: lzfse-${{ matrix.platform }}
          path: dist

      - name: Verify / 驗證
        if: runner.os != 'Windows'
        shell: bash
        run: zsh verify_archive.zsh dist/lzfse-*-${{ matrix.platform }}.tar.zst ${{ matrix.platform }}

      - name: Verify (Windows) / 驗證（Windows）
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: zsh verify_archive.zsh dist/lzfse-*-${{ matrix.platform }}.tar.zst ${{ matrix.platform }}
